codeRepositoryPath: .
transformationName: AWS/comprehensive-codebase-analysis
buildCommand: mvn -DskipTests clean install
validationCommands: mvn -DskipTests clean install

additionalPlanContext: |
  Refactor this Java 21-upgraded OpenMRS codebase into a modular monolith.

  Constraints:
  - Keep one deployable application
  - Keep one database
  - Do not split into microservices
  - Introduce domain-aligned internal modules:
    patient, person, encounter, observation, orders, concepts,
    users-admin, location, integration, search-reporting, web-adapter
  - Minimize schema changes
  - Extract clear interfaces between modules
  - Reduce cyclic dependencies
  - Separate web adapters from domain logic
  - Preserve business behavior

  Architecture rules:
  - Each business module should separate domain, application, and infrastructure
  - Web/controllers/REST endpoints must not contain business logic
  - Integration concerns such as HL7 and external adapters must be isolated
  - Shared code should be kept minimal and intentional
  - Preserve deployability on AWS EC2 Linux during intermediate stages

  Required output:
  - phased refactor plan
  - package move recommendations
  - interface extraction recommendations
  - buildable code changes where safe
