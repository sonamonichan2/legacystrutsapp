codeRepositoryPath: .
transformationName: AWS/java-version-upgrade

buildCommand: |
  export JAVA_HOME=/usr/lib/jvm/java-1.8.0-amazon-corretto.x86_64
  export PATH=$JAVA_HOME/bin:$PATH
  mvn -DskipTests clean install

validationCommands: |
  export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64
  export PATH=$JAVA_HOME/bin:$PATH
  mvn -DskipTests clean install

additionalPlanContext: |
  Upgrade this OpenMRS Core 2.0.3 codebase from Java 8 to Java 21.

  Constraints:
  - Preserve WAR deployability in this wave
  - Do not convert to microservices
  - Remove or replace outdated JDK-dependent build-time tooling
  - Keep behavior unchanged unless required for Java 21 compatibility
  - Identify any blocking dependency upgrades required
  - Produce a buildable result and call out compatibility issues clearly

  Important:
  - The codebase currently contains legacy build-time pieces that are sensitive to newer JDKs
  - Prefer minimal but correct changes in this wave
